org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# AGP 9 built-in Kotlin (larid#18). Committed explicitly so Flutter's migrator
# doesn't write its temporary opt-out (builtInKotlin=false) at build time.
# newDsl=false: Flutter's Gradle plugin still targets the legacy AGP DSL
# (flutter/flutter#184839).
android.builtInKotlin=true
android.newDsl=false
